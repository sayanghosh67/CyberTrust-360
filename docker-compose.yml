version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cybertrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybertrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybertrust_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cybertrust_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybertrust} -d ${POSTGRES_DB:-cybertrust_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

